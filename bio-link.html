<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jorge | Enlaces</title>
  <meta name="description" content="Enlaces de Jorge: emprendimiento, tecnología y turismo.">
  <style>
    :root {
      --bg-top: #0f172a;
      --bg-bottom: #1e293b;
      --card: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.25);
    }

    h1 { font-size: 1.4rem; margin-bottom: 6px; }

    .bio {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .links { display: flex; flex-direction: column; gap: 12px; }

    .link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius);
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .link:hover,
    .link:focus-visible {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
      outline: none;
    }

    .link .icon { font-size: 1.2rem; width: 28px; }
    .link .label { flex: 1; text-align: left; }
    .link .arrow { color: var(--muted); transition: transform 0.2s ease; }
    .link:hover .arrow { transform: translateX(4px); color: var(--accent); }

    .copy-btn {
      margin-top: 24px;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: color 0.2s, border-color 0.2s;
    }

    .copy-btn:hover { color: var(--text); border-color: var(--accent); }

    footer {
      margin-top: 32px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent);
      color: #0f172a;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="avatar" id="avatar">J</div>
    <h1>Jorge</h1>
    <p class="bio">Emprendedor y desarrollador en Medellín. Construyo productos digitales, enseño software y promuevo el turismo rural de Antioquia.</p>

    <nav class="links" id="links" aria-label="Enlaces principales">
      <a class="link" href="https://viajemos.co" target="_blank" rel="noopener noreferrer">
        <span class="icon">🧭</span>
        <span class="label">Viajemos.co</span>
        <span class="arrow">→</span>
      </a>
      <a class="link" href="https://giroplay.com" target="_blank" rel="noopener noreferrer">
        <span class="icon">💳</span>
        <span class="label">Giroplay</span>
        <span class="arrow">→</span>
      </a>
      <a class="link" href="https://waia.co" target="_blank" rel="noopener noreferrer">
        <span class="icon">🤖</span>
        <span class="label">WAIA · Agentes de IA</span>
        <span class="arrow">→</span>
      </a>
      <a class="link" href="#contacto" data-scroll>
        <span class="icon">✉️</span>
        <span class="label">Contacto</span>
        <span class="arrow">→</span>
      </a>
    </nav>

    <button class="copy-btn" id="copyBtn" type="button">Copiar enlace de esta página</button>

    <footer>© <span id="year"></span> Jorge · Medellín, Colombia</footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      // Año automático en el footer
      document.getElementById('year').textContent = new Date().getFullYear();

      // Efecto de entrada escalonado en los enlaces
      const links = document.querySelectorAll('.link');
      links.forEach((link, i) => {
        link.style.opacity = '0';
        link.style.animation = `fadeIn 0.5s ease-out ${0.15 + i * 0.08}s forwards`;
      });

      // Scroll suave para enlaces internos
      document.querySelectorAll('[data-scroll]').forEach(el => {
        el.addEventListener('click', e => {
          const target = document.querySelector(el.getAttribute('href'));
          if (target) {
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth' });
          }
        });
      });

      // Copiar enlace de la página
      const toast = document.getElementById('toast');
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove('show'), 2000);
      }

      document.getElementById('copyBtn').addEventListener('click', async () => {
        const url = window.location.href;
        try {
          await navigator.clipboard.writeText(url);
          showToast('¡Enlace copiado!');
        } catch (err) {
          showToast('No se pudo copiar el enlace');
        }
      });

      // Registro simple de clics (útil para analítica básica en consola)
      document.querySelectorAll('.link').forEach(link => {
        link.addEventListener('click', () => {
          console.log('Clic en:', link.querySelector('.label').textContent);
        });
      });
    })();
  </script>
</body>
</html>
